# Integración continua: cada push y cada PR corre las pruebas del backend (contra un Postgres con pgvector REAL, así también se prueba la
# búsqueda por pgvector y el índice HNSW que en la notebook sin Docker se omiten) y la verificación de tipos y el build del front.
# Los golden sets y la batería de seguridad con Bedrock no corren aquí (necesitan credenciales de AWS): se ejecutan desde la plataforma
# (golden sets automáticos al cambiar documentos o la configuración del agente) y con backend/auditoria_ia/auditar.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chatbot_test
      EMBEDDINGS_BACKEND: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependencias (torch en versión CPU: las pruebas usan el embedder hash, no el modelo)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt
      - name: Migraciones (upgrade, check y downgrade del último paso)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chatbot_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
      - name: Pruebas del backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
